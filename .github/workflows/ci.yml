name: Validate package
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Load shared archive verifier
        if: matrix.node == 24
        id: release-tools
        uses: abhi1693/actions/.github/actions/npm-release@428c8e48880754633e3b4e4f1c90c3fdc876effa # v1.1.2
      - name: Verify actual release archive
        if: matrix.node == 24
        env:
          TOOLS: ${{ steps.release-tools.outputs.path }}
          PACKAGE_NAME: '@abhi1693/medusa-nextjs-jsonld'
        run: node "$TOOLS/package.mjs" --check-only
